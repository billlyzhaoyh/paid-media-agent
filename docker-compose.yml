services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAID_MEDIA_RUNTIME: self_hosted
      PAID_MEDIA_API_HOST: 0.0.0.0
    # One process serves the API and, when configured, Slack in Socket Mode: DuckDB lets a single
    # process hold the state file, so do not scale this service beyond one replica.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - workspace:/app/workspace
      - ./workspace/skills:/app/skills:ro
      - ./config:/app/config:ro
volumes:
  workspace:
