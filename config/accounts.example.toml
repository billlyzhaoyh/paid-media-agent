# Account aliases map public, human-readable names to host-owned provider account ids.
# The model only ever sees the alias. Provider ids never enter prompts, Slack, or artifacts.
# These ids are fixture examples for the offline demo. Replace them with your own accounts:
#   - Meta: provider_account_id = "act_1234567890"; set conversion_action to the action type that
#     counts as a conversion (e.g. "offsite_conversion.fb_pixel_purchase" or "lead"). Without it
#     Meta conversions are recorded as missing; `paid-media-agent doctor --live` lists the types
#     your account reports.
#   - Google Ads: the customer id as ten digits without dashes. Conversions are the account's
#     primary conversions (metrics.conversions); conversion_action is not used.
# Then run `paid-media-agent doctor --live` before the first sync.

[accounts.demo-google]
platform = "google_ads"
provider_account_id = "fixture-google-0001"
currency = "USD"
timezone = "America/New_York"

[accounts.demo-meta]
platform = "meta_ads"
provider_account_id = "fixture-meta-0001"
currency = "USD"
timezone = "America/New_York"

[accounts.demo-reddit]
platform = "reddit_ads"
provider_account_id = "fixture-reddit-0001"
currency = "USD"
timezone = "America/New_York"
