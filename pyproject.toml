[project]
name = "paid-media-agent"
version = "0.1.0"
description = "Paid-media analysis and reporting by StructureML. Runs locally or in Docker."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "StructureML" }]
requires-python = ">=3.11"
keywords = ["paid-media", "agent", "mcp", "pipeboard", "slack", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    # Pipeboard connects over Streamable HTTP MCP.
    "mcp>=1.24,<2",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "click>=8.2,<9",
    # Every tool call is validated against the schema the model saw before it runs.
    "jsonschema>=4.23,<5",
    # API and optional local setup console.
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "jinja2>=3.1,<4",
    # Process-local state: conversations, proposals, approvals, receipts, and threads.
    "duckdb>=1.4,<2",
]

[project.urls]
Repository = "https://github.com/billlyzhaoyh/paid-media-agent"
Changelog = "https://github.com/billlyzhaoyh/paid-media-agent/blob/main/CHANGELOG.md"
Security = "https://github.com/billlyzhaoyh/paid-media-agent/blob/main/SECURITY.md"

[project.scripts]
paid-media-agent = "paid_media_agent.cli:main"

[project.optional-dependencies]
# Self-hosted path: the Slack adapter and the production ASGI server. State lives in DuckDB.
slack = ["slack-bolt>=1.30,<2", "slack-sdk>=3.44.1,<4", "aiohttp>=3.9,<4"]
self-host = ["uvicorn[standard]>=0.35,<1"]
# Host PDF rendering needs native libraries; the Docker image includes them.
reports = ["weasyprint>=70,<71"]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "TID", "ARG", "S", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
"src/paid_media_agent/admin/server.py" = ["B008"]
"src/paid_media_agent/surfaces/api/app.py" = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
