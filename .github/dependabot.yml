version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      runtime-stack:
        patterns:
          - "duckdb"
          - "httpx"
          - "mcp"
          - "numpy"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
