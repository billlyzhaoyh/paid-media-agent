version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      langchain-stack:
        patterns:
          - "deepagents"
          - "langchain*"
          - "langgraph*"
          - "mcp"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
